# Decap CMS configuration for imancorner.org
#
# The GitHub backend logs in through the sveltia-cms-auth OAuth gateway
# (Cloudflare Worker) referenced by base_url below.
backend:
  name: github
  repo: asraful/imancorner
  branch: main
  base_url: https://sveltia-cms-auth.imancorner.workers.dev

media_folder: public/images/uploads
public_folder: /images/uploads

# All content is trilingual. Each collection is a single list of entries; the
# editor shows a language switcher (EN / AR / FI) so every translation is
# written in one place, and each language is saved to its own folder
# (e.g. src/content/events/ar/<entry>.md). Translations of one entry share the
# filename, which is also the URL slug — derived from the English title.
i18n:
  structure: multiple_folders
  locales: [en, ar, fi]
  default_locale: en

collections:
  - name: events
    label: Events
    label_singular: event
    folder: src/content/events
    i18n: true
    create: true
    summary: '{{title}} — {{fields.eventDate}}'
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - label: Event date
        name: eventDate
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'YYYY-MM-DD'
        time_format: false
        i18n: duplicate
      - { label: Location, name: location, widget: string, i18n: true }
      - label: Video URL
        name: videoUrl
        widget: string
        required: false
        i18n: duplicate
        hint: 'Any YouTube link works — watch, share (youtu.be) or embed URL. Leave empty if there is no video.'
      - { label: Tags, name: tags, widget: list, required: false, default: [], i18n: true }
      - label: Draft
        name: isDraft
        widget: boolean
        default: false
        i18n: duplicate
        hint: 'Drafts are never published to the website.'
      - { label: Body, name: body, widget: markdown, i18n: true }

  # Standalone pages (About, Contact, …) published at /<language>/<slug>/.
  # "Show in menu" adds the page to the header navigation.
  - name: pages
    label: Pages
    label_singular: page
    folder: src/content/pages
    i18n: true
    create: true
    summary: '{{title}}'
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - label: Description
        name: description
        widget: string
        required: false
        i18n: true
        hint: 'Short summary used by search engines. Optional.'
      - label: Show in menu
        name: showInNav
        widget: boolean
        default: false
        i18n: duplicate
        hint: 'Adds this page to the site header navigation.'
      - label: Menu order
        name: navOrder
        widget: number
        value_type: int
        default: 0
        i18n: duplicate
        hint: 'Lower numbers appear first in the menu.'
      - label: Draft
        name: isDraft
        widget: boolean
        default: false
        i18n: duplicate
        hint: 'Drafts are never published to the website.'
      - { label: Body, name: body, widget: markdown, i18n: true }
